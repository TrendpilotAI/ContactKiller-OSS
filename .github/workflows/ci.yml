name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-release:
    name: Public release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun scripts/check-public-release.ts
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
      - name: Scan repository history for secrets
        run: /tmp/gitleaks git . --redact

  source-tools:
    name: Source tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install checksum-pinned DuckDB CLI
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip \
            --output /tmp/duckdb-cli.zip
          echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  /tmp/duckdb-cli.zip" \
            | sha256sum --check --strict
          unzip -q /tmp/duckdb-cli.zip -d /tmp/duckdb-cli
          sudo install -m 0755 /tmp/duckdb-cli/duckdb /usr/local/bin/duckdb
          duckdb --version
      - run: bun test scripts/forensic-cache.test.ts scripts/mesh-mcp-snapshot.test.ts

  web:
    name: Web prototype
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install checksum-pinned SurrealDB server
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/surrealdb/surrealdb/releases/download/v3.3.0/surreal-v3.3.0.linux-amd64.tgz \
            --output /tmp/surreal.tgz
          echo "44aeab565f7e7e39d2d0bf0583c8aae648babc91373c70b2658288d95bbbcd55  /tmp/surreal.tgz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/surreal.tgz --directory /tmp surreal
          sudo install -m 0755 /tmp/surreal /usr/local/bin/surreal
          surreal version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Persistence tests against a real SurrealDB server
        run: bun test
      - run: bun run build
        env:
          SURREALDB_URL: http://127.0.0.1:8000
          SURREALDB_NAMESPACE: contactkiller
          SURREALDB_DATABASE: contactkiller
          GOOGLE_CLIENT_ID: synthetic-ci-placeholder
          GOOGLE_CLIENT_SECRET: synthetic-ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  launch-site:
    name: Launch site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  activegraph:
    name: ActiveGraph pack
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: activegraph-contactkiller
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: activegraph-contactkiller/pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
