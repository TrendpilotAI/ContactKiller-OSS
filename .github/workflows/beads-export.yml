name: Beads export scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beads-export-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beads-export:
    name: Beads export scan
    runs-on: ubuntu-24.04
    env:
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install checksum-pinned bd
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz \
            --output /tmp/beads.tar.gz
          echo "3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c  /tmp/beads.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/beads.tar.gz --directory /tmp bd
          sudo install -m 0755 /tmp/bd /usr/local/bin/bd
          bd metrics off
          bd version
          git config --global beads.role contributor
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Use the base branch's audit log as the expected-ticket baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          baseline="$RUNNER_TEMP/audit-baseline.jsonl"
          if git cat-file -e "$BASE_SHA:.beads/interactions.jsonl" 2>/dev/null; then
            git show "$BASE_SHA:.beads/interactions.jsonl" > "$baseline"
          else
            : > "$baseline"
          fi
          echo "BEADS_AUDIT_BASELINE=$baseline" >> "$GITHUB_ENV"
      - name: Bootstrap published tracker data, export, and scan
        run: scripts/check-beads-export.sh
